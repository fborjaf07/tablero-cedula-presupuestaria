  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n    <span style=\"opacity:.8\">Dirección Financiera · Dirección de Gestión de Obras Públicas<\u002Fspan>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;opacity:.8\">{{ sello }}<\u002Fspan>\n  <\u002Fheader>\n\n  <div style=\"background:#fff;padding:22px 32px 18px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;border-bottom:1px solid #DCD6C8\">\n    <div>\n      <span style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:.22em;color:#6B7280;font-weight:600;display:block;margin-bottom:6px\">Rendición presupuestaria · Ejercicio 2026<\u002Fspan>\n      <h1 style=\"font-family:'DM Serif Display',Georgia,serif;font-size:33px;line-height:1.08;margin:0 0 5px;font-weight:400;letter-spacing:-.012em;color:#1A1F2C\">Cédula presupuestaria consolidada<\u002Fh1>\n      <p style=\"margin:0;font-size:13px;color:#6B7280\">{{ subtitulo }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px\" class=\"no-print\">\n      <div style=\"display:flex;gap:8px\">\n        <button sc-camel-on-click=\"{{ exportar }}\" style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#0F3460;background:#fff;border:1px solid #DCD6C8;padding:9px 15px;cursor:pointer\" style-hover=\"background:#F4F0E6\">Exportar CSV<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ imprimir }}\" style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#fff;background:#0F3460;border:1px solid #0F3460;padding:9px 15px;cursor:pointer\" style-hover=\"background:#0A2447\">Imprimir<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hayEdiciones }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:inline-flex;align-items:center;gap:10px;font-size:11px;font-family:'JetBrains Mono',monospace;background:#F5EBC9;border:1px solid #C9A227;color:#7A6212;padding:5px 10px\">\n          <span>{{ textoEdiciones }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ descartar }}\" style=\"font:inherit;text-transform:uppercase;letter-spacing:.08em;background:transparent;border:1px solid #C9A227;color:#7A6212;padding:1px 7px;cursor:pointer\">Descartar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;height:4px\"><i style=\"flex:1;background:#0F3460\"><\u002Fi><i style=\"flex:1;background:#C0392B\"><\u002Fi><i style=\"flex:1;background:#C9A227\"><\u002Fi><\u002Fdiv>\n\n  <nav class=\"no-print\" style=\"background:#fff;border-bottom:1px solid #DCD6C8;padding:0 32px;display:flex;flex-wrap:wrap;align-items:flex-end\">\n    <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n      <button sc-camel-on-click=\"{{ t.on }}\" style=\"background:transparent;border:none;border-bottom:2px solid {{ t.linea }};padding:16px 24px 14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:10px;color:{{ t.fg }}\">\n        {{ t.label }}\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;padding:1px 8px;background:{{ t.chipBg }};color:{{ t.chipFg }}\">{{ t.sub }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n\n  <div class=\"no-print\" style=\"position:sticky;top:0;z-index:30;background:#F4F0E6;border-bottom:1px solid #DCD6C8;padding:12px 32px;display:flex;gap:22px;align-items:center;flex-wrap:wrap\">\n    <div style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap\">\n      <span style=\"font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#6B7280;font-weight:600;margin-right:2px\">Periodo<\u002Fspan>\n      <sc-for list=\"{{ meses }}\" as=\"m\" hint-placeholder-count=\"9\">\n        <button sc-camel-on-click=\"{{ m.on }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:6px 11px;border:1px solid {{ m.borde }};cursor:pointer;background:{{ m.bg }};color:{{ m.fg }}\">{{ m.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:18px;align-items:center;flex-wrap:wrap\">\n      <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:nowrap\">\n        <span style=\"font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#6B7280;font-weight:600\">Partida<\u002Fspan>\n        <sc-raw-select value=\"{{ grupoSel }}\" sc-camel-on-change=\"{{ onGrupo }}\" style=\"font-size:12.5px;padding:6px 10px;border:1px solid #DCD6C8;background:#fff;color:#1A1F2C;max-width:330px\">\n          <sc-for list=\"{{ opcionesGrupo }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <option value=\"{{ o.valor }}\">{{ o.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:nowrap\">\n        <span style=\"font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#6B7280;font-weight:600\">Ámbito<\u002Fspan>\n        <sc-raw-select value=\"{{ ambitoSel }}\" sc-camel-on-change=\"{{ onAmbito }}\" style=\"font-size:12.5px;padding:6px 10px;border:1px solid #DCD6C8;background:#fff;color:#1A1F2C\">\n          <sc-for list=\"{{ opcionesAmbito }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <option value=\"{{ o.valor }}\" disabled=\"{{ o.vacio }}\">{{ o.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n      <span style=\"font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#6B7280;font-weight:600\">Etapa<\u002Fspan>\n      <sc-for list=\"{{ chipsEtapa }}\" as=\"c\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ c.on }}\" style=\"font-size:12px;padding:6px 11px;border:1px solid {{ c.borde }};cursor:pointer;background:{{ c.bg }};color:{{ c.fg }}\">{{ c.label }} <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;opacity:.75\">{{ c.n }}<\u002Fspan><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:#6B7280\">{{ alcance }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <main style=\"padding:30px 32px 70px;max-width:1420px;margin:0 auto\">\n\n    <sc-if value=\"{{ cargando }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#6B7280;padding:60px 0;text-align:center\">Leyendo datos.json…<\u002Fp>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ vacio }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border:1px solid #DCD6C8;border-left:3px solid #C9A227;padding:26px 28px;max-width:680px\">\n        <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0 0 6px\">Sin partidas en este ámbito<\u002Fh2>\n        <p style=\"margin:0;font-size:13.5px;color:#3B4252\">{{ textoVacio }}<\u002Fp>\n        <button sc-camel-on-click=\"{{ verTodo }}\" class=\"no-print\" style=\"margin-top:18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#fff;background:#0F3460;border:none;padding:9px 15px;cursor:pointer\">Ver todo el presupuesto<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ esResumen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));background:#fff;border:1px solid #DCD6C8\">\n          <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n            <div style=\"padding:22px 24px 20px;border-left:1px solid #E8E2D2\">\n              <div style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:#6B7280;font-weight:600;margin-bottom:14px\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font-family:'DM Serif Display',Georgia,serif;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:{{ k.color }}\">{{ k.valor }}<\u002Fdiv>\n              <div style=\"height:4px;background:#E8E2D2;margin:14px 0 10px\"><i style=\"display:block;height:100%;width:{{ k.ancho }};background:{{ k.color }}\"><\u002Fi><\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#6B7280;line-height:1.5\">{{ k.nota }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));background:#fff;border:1px solid #DCD6C8;border-top:none\">\n          <sc-for list=\"{{ kpis2 }}\" as=\"k\" hint-placeholder-count=\"4\">\n            <div style=\"padding:16px 24px 15px;border-left:1px solid #E8E2D2;border-top:1px solid #E8E2D2\">\n              <div style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:#6B7280;font-weight:600;margin-bottom:8px\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;color:{{ k.color }}\">{{ k.valor }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#6B7280;margin-top:5px\">{{ k.nota }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px\">\n          <section style=\"background:#fff;border:1px solid #DCD6C8;padding:22px 24px 24px\">\n            <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0 0 4px\">Embudo de ejecución<\u002Fh2>\n            <p style=\"margin:0 0 20px;font-size:12.5px;color:#6B7280\">De cada etapa a la siguiente hay una caída; la cifra de la derecha la cuantifica.<\u002Fp>\n            <sc-for list=\"{{ embudo }}\" as=\"e\" hint-placeholder-count=\"4\">\n              <div style=\"margin-bottom:16px\">\n                <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:5px\">\n                  <span style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#3B4252\">{{ e.label }}<\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9AA1AD\">{{ e.pct }}<\u002Fspan>\n                  <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums\">{{ e.monto }}<\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9B2C2C;width:96px;text-align:right\">{{ e.caida }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:16px;background:#F4F0E6\"><i style=\"display:block;height:100%;width:{{ e.ancho }};background:{{ e.color }}\"><\u002Fi><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n\n          <section style=\"background:#fff;border:1px solid #DCD6C8;padding:22px 24px 24px\">\n            <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0 0 4px\">De dónde viene el dinero<\u002Fh2>\n            <p style=\"margin:0 0 18px;font-size:12.5px;color:#6B7280\">Codificado y avance por fuente de financiamiento.<\u002Fp>\n            <sc-for list=\"{{ fuentes }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div style=\"padding:11px 0;border-bottom:1px solid #E8E2D2\">\n                <div style=\"display:flex;align-items:baseline;gap:10px\">\n                  <span style=\"font-size:13px;font-weight:500;line-height:1.3\">{{ f.nombre }}<\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9AA1AD\">{{ f.n }}<\u002Fspan>\n                  <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums\">{{ f.codificado }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:9px;background:#F4F0E6;margin-top:7px;position:relative\">\n                  <i style=\"position:absolute;left:0;top:0;height:100%;width:{{ f.aCert }};background:#0F3460;opacity:.35\"><\u002Fi>\n                  <i style=\"position:absolute;left:0;top:0;height:100%;width:{{ f.aComp }};background:#C9A227;opacity:.75\"><\u002Fi>\n                  <i style=\"position:absolute;left:0;top:0;height:100%;width:{{ f.aDev }};background:#3F6B45\"><\u002Fi>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:16px;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#6B7280\">\n                  <span>cert. {{ f.pCert }}<\u002Fspan><span>comp. {{ f.pComp }}<\u002Fspan><span>deveng. {{ f.pDev }}<\u002Fspan>\n                  <span style=\"margin-left:auto;color:#0F3460\">por certificar {{ f.porCertificar }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;gap:18px;margin-top:14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#6B7280;flex-wrap:wrap\">\n              <span style=\"display:inline-flex;align-items:center;gap:7px\"><i style=\"width:10px;height:10px;background:#0F3460;opacity:.35\"><\u002Fi>Certificado<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:7px\"><i style=\"width:10px;height:10px;background:#C9A227\"><\u002Fi>Comprometido<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:7px\"><i style=\"width:10px;height:10px;background:#3F6B45\"><\u002Fi>Devengado<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n\n        <section style=\"background:#fff;border:1px solid #DCD6C8;padding:22px 24px 20px;margin-top:22px\">\n          <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0 0 4px\">Estado de los proyectos del PAC<\u002Fh2>\n          <p style=\"margin:0 0 18px;font-size:12.5px;color:#6B7280\">{{ notaProyectos }}<\u002Fp>\n          <div style=\"display:flex;height:30px;overflow:hidden\">\n            <sc-for list=\"{{ estados }}\" as=\"e\" hint-placeholder-count=\"5\">\n              <i style=\"display:block;height:100%;width:{{ e.ancho }};background:{{ e.color }}\"><\u002Fi>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:16px\">\n            <sc-for list=\"{{ estados }}\" as=\"e\" hint-placeholder-count=\"5\">\n              <div style=\"border-left:3px solid {{ e.color }};padding:2px 0 2px 10px\">\n                <div style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#6B7280;font-weight:600\">{{ e.label }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums\">{{ e.monto }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9AA1AD\">{{ e.nota }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"background:#fff;border:1px solid #DCD6C8;padding:22px 24px 22px;margin-top:22px\">\n          <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0 0 4px\">Gasto computable y no computable<\u002Fh2>\n          <p style=\"margin:0 0 18px;font-size:12.5px;color:#6B7280\">Grupos 73, 75, 77, 84 y 88 entran en el control de gasto computable; nómina y gasto corriente quedan fuera.<\u002Fp>\n          <div style=\"display:flex;height:32px\">\n            <i style=\"display:block;height:100%;width:{{ comp.ancho }};background:#0F3460\"><\u002Fi>\n            <i style=\"display:block;height:100%;flex:1;background:#B8AE98\"><\u002Fi>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px\">\n            <sc-for list=\"{{ comp.bloques }}\" as=\"b\" hint-placeholder-count=\"2\">\n              <div style=\"border-left:3px solid {{ b.color }};padding:2px 0 2px 12px\">\n                <div style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:#6B7280;font-weight:600\">{{ b.label }}<\u002Fdiv>\n                <div style=\"font-family:'DM Serif Display',Georgia,serif;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;color:{{ b.color }}\">{{ b.codificado }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6B7280;margin-top:4px\">{{ b.detalle }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"background:#fff;border:1px solid #DCD6C8;padding:22px 24px 22px;margin-top:22px\">\n          <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0 0 4px\">Dónde está el dinero<\u002Fh2>\n          <p style=\"margin:0 0 18px;font-size:12.5px;color:#6B7280\">Cada rectángulo es una partida general: el área es el monto codificado y el color, cuánto se ha devengado.<\u002Fp>\n          <div style=\"position:relative;width:100%;height:380px;background:#F4F0E6\">\n            <sc-for list=\"{{ treemap }}\" as=\"c\" hint-placeholder-count=\"8\">\n              <div style=\"position:absolute;left:{{ c.x }};top:{{ c.y }};width:{{ c.w }};height:{{ c.h }};background:{{ c.color }};border:1px solid #FAF8F3;overflow:hidden;padding:7px 9px\">\n                <div style=\"font-size:11.5px;font-weight:600;line-height:1.25;color:{{ c.fg }}\">{{ c.nombre }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:{{ c.fg2 }};margin-top:2px\">{{ c.monto }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:{{ c.fg2 }}\">{{ c.pct }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-top:12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#6B7280\">\n            <span>0 % devengado<\u002Fspan>\n            <i style=\"flex:1;height:8px;background:linear-gradient(90deg,#DCD6C8,#3F6B45)\"><\u002Fi>\n            <span>30 % o más<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"background:#fff;border:1px solid #DCD6C8;padding:22px 24px 24px;margin-top:22px\">\n          <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0 0 4px\">Las partidas más grandes<\u002Fh2>\n          <p style=\"margin:0 0 20px;font-size:12.5px;color:#6B7280\">Barra completa: codificado. Dorado: comprometido. Verde: devengado.<\u002Fp>\n          <sc-for list=\"{{ ranking }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div style=\"display:grid;grid-template-columns:minmax(180px,240px) 1fr 130px;gap:16px;align-items:center;padding:9px 0;border-bottom:1px solid #E8E2D2\">\n              <div>\n                <div style=\"font-size:13px;font-weight:500;line-height:1.3\">{{ r.nombre }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9AA1AD\">{{ r.codigo }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:18px;background:#F4F0E6;position:relative\">\n                <i style=\"position:absolute;left:0;top:0;height:100%;width:{{ r.aCod }};background:#DCD6C8\"><\u002Fi>\n                <i style=\"position:absolute;left:0;top:0;height:100%;width:{{ r.aComp }};background:#C9A227;opacity:.8\"><\u002Fi>\n                <i style=\"position:absolute;left:0;top:0;height:100%;width:{{ r.aDev }};background:#3F6B45\"><\u002Fi>\n              <\u002Fdiv>\n              <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums\">{{ r.codificado }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n\n        <section style=\"background:#fff;border:1px solid #DCD6C8;padding:22px 24px 20px;margin-top:22px;overflow-x:auto\">\n          <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0 0 4px\">Saldo disponible por partida<\u002Fh2>\n          <p style=\"margin:0 0 6px;font-size:12.5px;color:#6B7280\">Ordenadas por saldo pendiente de certificar: el espacio real que queda para contratar.<\u002Fp>\n          <p style=\"margin:0 0 16px;font-size:12.5px;color:#3B4252\">{{ notaSaldos }}<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:minmax(190px,1fr) 122px 138px 138px 138px 128px 62px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9AA1AD;border-bottom:1px solid #1A1F2C;padding-bottom:7px\">\n            <span>Partida<\u002Fspan><span style=\"text-align:right\">Codificado<\u002Fspan><span style=\"text-align:right\">Certificado a proyectos<\u002Fspan><span style=\"text-align:right\">Por certificar · con proyecto<\u002Fspan><span style=\"text-align:right\">Por certificar · sin proyecto<\u002Fspan><span style=\"text-align:right\">Por devengar<\u002Fspan><span style=\"text-align:right\">% libre<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ saldos }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"display:grid;grid-template-columns:minmax(190px,1fr) 122px 138px 138px 138px 128px 62px;padding:8px 0;border-bottom:1px solid #E8E2D2;align-items:baseline\">\n              <span>\n                <span style=\"font-size:13px;font-weight:500\">{{ s.nombre }}<\u002Fspan>\n                <span style=\"display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9AA1AD\">{{ s.codigo }}<\u002Fspan>\n                <span style=\"display:flex;height:5px;margin-top:5px;background:#F4F0E6;max-width:200px\"><i style=\"display:block;height:100%;width:{{ s.aAsignado }};background:#0F3460\"><\u002Fi><i style=\"display:block;height:100%;width:{{ s.aConP }};background:#C9A227\"><\u002Fi><i style=\"display:block;height:100%;width:{{ s.aSin }};background:#B04A3E\"><\u002Fi><\u002Fspan>\n              <\u002Fspan>\n              <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums\">{{ s.codificado }}<\u002Fspan>\n              <span style=\"text-align:right\">\n                <span style=\"display:block;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums;color:#0F3460;font-weight:500\">{{ s.asignado }}<\u002Fspan>\n                <span style=\"display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:#9AA1AD\">{{ s.nProyectos }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"text-align:right\">\n                <span style=\"display:block;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:500;color:{{ s.colorConP }}\">{{ s.conProyecto }}<\u002Fspan>\n                <span style=\"display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:#9AA1AD\">{{ s.nPlan }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:500;color:{{ s.colorSin }}\">{{ s.libre }}<\u002Fspan>\n              <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums;color:#8A6E19\">{{ s.porDevengar }}<\u002Fspan>\n              <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;color:#6B7280\">{{ s.pctLibre }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;gap:18px;margin-top:14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#6B7280;flex-wrap:wrap\">\n            <span style=\"display:inline-flex;align-items:center;gap:7px\"><i style=\"width:10px;height:10px;background:#0F3460\"><\u002Fi>Certificado a proyectos<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:7px\"><i style=\"width:10px;height:10px;background:#C9A227\"><\u002Fi>Por certificar con proyecto planificado<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:7px\"><i style=\"width:10px;height:10px;background:#B04A3E\"><\u002Fi>Por certificar sin proyecto<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div style=\"margin-top:30px\">\n          <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:23px;font-weight:400;margin:0 0 4px\">Indicadores por partida<\u002Fh2>\n          <p style=\"margin:0 0 16px;font-size:12.5px;color:#6B7280\">{{ notaIndicadores }}<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px\">\n            <sc-for list=\"{{ indicadores }}\" as=\"i\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fff;border:1px solid #DCD6C8;padding:18px 20px 16px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n                  <div>\n                    <div style=\"font-size:14.5px;font-weight:600;line-height:1.25\">{{ i.nombre }}<\u002Fdiv>\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9AA1AD;margin-top:3px\">{{ i.meta }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"text-align:right\">\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums\">{{ i.codificado }}<\u002Fdiv>\n                    <div style=\"font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#9AA1AD\">Codificado<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin:14px 0 6px\">\n                  <sc-for list=\"{{ i.medidas }}\" as=\"m\" hint-placeholder-count=\"3\">\n                    <div style=\"display:grid;grid-template-columns:88px 1fr 96px 56px;gap:10px;align-items:center;margin-bottom:6px\">\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6B7280\">{{ m.label }}<\u002Fspan>\n                      <span style=\"height:8px;background:#F4F0E6;display:block\"><i style=\"display:block;height:100%;width:{{ m.ancho }};background:{{ m.color }}\"><\u002Fi><\u002Fspan>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right;color:#6B7280;font-variant-numeric:tabular-nums\">{{ m.monto }}<\u002Fspan>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums\">{{ m.pct }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#E8E2D2;border-top:1px solid #E8E2D2;margin-top:12px\">\n                  <div style=\"background:#FAF8F3;padding:8px 10px 6px\">\n                    <span style=\"display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9AA1AD\">Saldo por certificar<\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:#0F3460;font-variant-numeric:tabular-nums\">{{ i.porCertificar }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"background:#FAF8F3;padding:8px 10px 6px\">\n                    <span style=\"display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9AA1AD\">Saldo por devengar<\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:#8A6E19;font-variant-numeric:tabular-nums\">{{ i.porDevengar }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border-top:1px solid #E8E2D2;margin-top:12px;padding-top:10px\">\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#9AA1AD;margin-bottom:8px\">Proyectos de mayor monto<\u002Fdiv>\n                  <sc-for list=\"{{ i.topProyectos }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <div style=\"display:grid;grid-template-columns:1fr 100px;gap:10px;padding:5px 0;border-bottom:1px dotted #E8E2D2;align-items:baseline\">\n                      <div>\n                        <div style=\"font-size:12px;line-height:1.3\">{{ p.nombre }}<\u002Fdiv>\n                        <span style=\"display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:{{ p.color }};margin-top:3px\">{{ p.estado }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-variant-numeric:tabular-nums\">{{ p.monto }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ esProyectos }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));background:#fff;border:1px solid #DCD6C8;margin-bottom:22px\">\n        <sc-for list=\"{{ kpisProy }}\" as=\"k\" hint-placeholder-count=\"4\">\n          <div style=\"padding:20px 24px 18px;border-left:1px solid #E8E2D2\">\n            <div style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:#6B7280;font-weight:600;margin-bottom:12px\">{{ k.label }}<\u002Fdiv>\n            <div style=\"font-family:'DM Serif Display',Georgia,serif;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;color:{{ k.color }}\">{{ k.valor }}<\u002Fdiv>\n            <div style=\"height:4px;background:#E8E2D2;margin:12px 0 9px\"><i style=\"display:block;height:100%;width:{{ k.ancho }};background:{{ k.color }}\"><\u002Fi><\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#6B7280;line-height:1.45\">{{ k.nota }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <section style=\"background:#fff;border:1px solid #DCD6C8\">\n        <div style=\"padding:20px 24px 16px;border-bottom:1px solid #DCD6C8;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap\">\n          <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0\">Proyectos del PAC<\u002Fh2>\n          <p style=\"margin:0;font-size:12.5px;color:#6B7280\">{{ notaListaProyectos }}<\u002Fp>\n          <div class=\"no-print\" style=\"margin-left:auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap\">\n            <div style=\"display:flex;gap:6px;align-items:center\">\n              <span style=\"font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#6B7280;font-weight:600\">Estado<\u002Fspan>\n              <sc-raw-select value=\"{{ estadoPSel }}\" sc-camel-on-change=\"{{ onEstadoP }}\" style=\"font-size:12.5px;padding:5px 9px;border:1px solid #DCD6C8;background:#fff;max-width:300px\">\n                <sc-for list=\"{{ opcionesEstado }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <option value=\"{{ o.valor }}\">{{ o.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:6px;align-items:center\">\n              <span style=\"font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#6B7280;font-weight:600\">Ordenar<\u002Fspan>\n              <sc-raw-select value=\"{{ ordenSel }}\" sc-camel-on-change=\"{{ onOrden }}\" style=\"font-size:12.5px;padding:5px 9px;border:1px solid #DCD6C8;background:#fff\">\n                <sc-for list=\"{{ opcionesOrden }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <option value=\"{{ o.valor }}\">{{ o.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ proyectos }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"border-bottom:1px solid #E8E2D2;border-left:3px solid {{ p.color }}\">\n            <div sc-camel-on-click=\"{{ p.toggle }}\" style=\"display:grid;grid-template-columns:minmax(240px,1fr) 140px 150px 90px 30px;gap:14px;align-items:center;padding:12px 22px;cursor:pointer\">\n              <div>\n                <div style=\"font-size:13.5px;font-weight:500;line-height:1.32\">{{ p.nombre }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9AA1AD;margin-top:3px\">{{ p.meta }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#3B4252;margin-top:3px\">Fuente: {{ p.fuente }}<\u002Fdiv>\n                <div style=\"height:7px;background:#F4F0E6;margin-top:7px\"><i style=\"display:block;height:100%;width:{{ p.aAvance }};background:#3F6B45\"><\u002Fi><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-variant-numeric:tabular-nums\">{{ p.codificado }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#9AA1AD\">codificado<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:{{ p.color }}\">{{ p.estado }}<\u002Fspan>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6B7280;margin-top:4px\">{{ p.devengado }} devengado<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:13px;color:#3F6B45\">{{ p.avance }}<\u002Fdiv>\n              <div style=\"text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:#9AA1AD\">{{ p.signo }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ p.abierto }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#FAF8F3;border-top:1px solid #E8E2D2;padding:12px 22px 16px\">\n                <div style=\"display:grid;grid-template-columns:minmax(220px,1fr) repeat(4,120px);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9AA1AD;border-bottom:1px solid #B8AE98;padding-bottom:6px\">\n                  <span>Partida<\u002Fspan><span style=\"text-align:right\">Codificado<\u002Fspan><span style=\"text-align:right\">Certificado<\u002Fspan><span style=\"text-align:right\">Comprometido<\u002Fspan><span style=\"text-align:right\">Devengado<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ p.lineas }}\" as=\"l\" hint-placeholder-count=\"2\">\n                  <div style=\"display:grid;grid-template-columns:minmax(220px,1fr) repeat(4,120px);padding:7px 0;border-bottom:1px dotted #DCD6C8;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-variant-numeric:tabular-nums\">\n                    <span style=\"color:#3B4252;word-break:break-all;padding-right:12px\">{{ l.partida }}<\u002Fspan>\n                    <span style=\"text-align:right\">{{ l.codificado }}<\u002Fspan>\n                    <span style=\"text-align:right;color:#0F3460\">{{ l.certificado }}<\u002Fspan>\n                    <span style=\"text-align:right;color:#8A6E19\">{{ l.comprometido }}<\u002Fspan>\n                    <span style=\"text-align:right;color:#3F6B45\">{{ l.devengado }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"font-size:12px;color:#6B7280;margin-top:10px\">{{ p.nota }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ esPartidas }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"background:#fff;border:1px solid #DCD6C8;overflow-x:auto\">\n        <div style=\"padding:20px 24px 16px;border-bottom:1px solid #DCD6C8;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap\">\n          <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0\">Detalle por partida<\u002Fh2>\n          <p style=\"margin:0;font-size:12.5px;color:#6B7280\">Clic en la fila abre las subpartidas. Las celdas de monto son editables: escriba sobre la cifra para simular un escenario.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(240px,1fr) repeat(4,124px) 124px 66px 30px;gap:0;padding:0 24px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#9AA1AD;border-bottom:1px solid #1A1F2C\">\n          <span style=\"padding:9px 0\">Partida general<\u002Fspan>\n          <span style=\"padding:9px 6px;text-align:right\">Codificado<\u002Fspan>\n          <span style=\"padding:9px 6px;text-align:right\">Certificado<\u002Fspan>\n          <span style=\"padding:9px 6px;text-align:right\">Comprometido<\u002Fspan>\n          <span style=\"padding:9px 6px;text-align:right\">Devengado<\u002Fspan>\n          <span style=\"padding:9px 6px;text-align:right\">Por certificar<\u002Fspan>\n          <span style=\"padding:9px 6px;text-align:right\">% ejec.<\u002Fspan>\n          <span><\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ filas }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <div style=\"border-bottom:1px solid #E8E2D2;background:{{ f.fondo }}\">\n            <div style=\"display:grid;grid-template-columns:minmax(240px,1fr) repeat(4,124px) 124px 66px 30px;align-items:center;padding:10px 24px\">\n              <div sc-camel-on-click=\"{{ f.toggle }}\" style=\"cursor:pointer;padding-right:14px\">\n                <div style=\"font-size:14px;font-weight:600;line-height:1.3\">{{ f.denominacion }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9AA1AD;margin-top:2px\">{{ f.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ f.campos }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <input value=\"{{ c.valor }}\" sc-camel-on-change=\"{{ c.onChange }}\" sc-camel-on-blur=\"{{ c.onBlur }}\" style=\"width:100%;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums;padding:6px;border:1px solid {{ c.borde }};background:{{ c.bg }};color:{{ c.fg }}\" style-focus=\"border-color:#0F3460;outline:none\">\n              <\u002Fsc-for>\n              <div style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:0 6px;color:#0F3460\">{{ f.porCertificar }}<\u002Fdiv>\n              <div style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;padding:0 6px;color:#3F6B45\">{{ f.pctEjec }}<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ f.toggle }}\" style=\"cursor:pointer;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:#9AA1AD\">{{ f.signo }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ f.abierto }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#FAF8F3;border-top:1px solid #E8E2D2;padding:14px 24px 18px\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:#E8E2D2;border:1px solid #E8E2D2;margin-bottom:14px\">\n                  <sc-for list=\"{{ f.metricas }}\" as=\"m\" hint-placeholder-count=\"6\">\n                    <div style=\"background:#fff;padding:9px 12px\">\n                      <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#6B7280\">{{ m.label }}<\u002Fdiv>\n                      <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;color:{{ m.color }}\">{{ m.valor }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-bottom:16px\">\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#9AA1AD;margin-bottom:8px\">Fuente de financiamiento<\u002Fdiv>\n                  <sc-for list=\"{{ f.fuentesG }}\" as=\"fu\" hint-placeholder-count=\"2\">\n                    <div style=\"display:grid;grid-template-columns:minmax(200px,300px) 1fr 130px 62px;gap:12px;align-items:center;padding:4px 0\">\n                      <span style=\"font-size:12.5px\">{{ fu.nombre }}<\u002Fspan>\n                      <span style=\"height:8px;background:#EFEADC;display:block\"><i style=\"display:block;height:100%;width:{{ fu.ancho }};background:#0F3460\"><\u002Fi><\u002Fspan>\n                      <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;font-variant-numeric:tabular-nums\">{{ fu.monto }}<\u002Fspan>\n                      <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#6B7280\">{{ fu.pct }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ f.hayPlan }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-bottom:18px;border-left:3px solid #C9A227;padding-left:12px\">\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8A6E19;margin-bottom:4px\">Proyectos planificados en el codificado<\u002Fdiv>\n                    <p style=\"margin:0 0 10px;font-size:12px;color:#6B7280\">{{ f.notaPlan }}<\u002Fp>\n                    <div style=\"display:grid;grid-template-columns:minmax(240px,1fr) 110px 190px 110px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9AA1AD;border-bottom:1px solid #B8AE98;padding-bottom:6px\">\n                      <span>Objeto de contratación<\u002Fspan><span>Naturaleza<\u002Fspan><span>Fuente<\u002Fspan><span style=\"text-align:right\">Monto POA<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ f.plan }}\" as=\"p\" hint-placeholder-count=\"3\">\n                      <div style=\"display:grid;grid-template-columns:minmax(240px,1fr) 110px 190px 110px;gap:10px;padding:7px 0;border-bottom:1px dotted #DCD6C8;align-items:baseline\">\n                        <span>\n                          <span style=\"font-size:12px;line-height:1.35;display:block\">{{ p.objeto }}<\u002Fspan>\n                          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#9AA1AD\">{{ p.partida }}<\u002Fspan>\n                        <\u002Fspan>\n                        <span style=\"font-size:11.5px;color:#6B7280\">{{ p.naturaleza }}<\u002Fspan>\n                        <span style=\"font-size:11.5px;color:#3B4252\">{{ p.fuente }}<\u002Fspan>\n                        <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;font-variant-numeric:tabular-nums;color:#8A6E19\">{{ p.monto }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"display:grid;grid-template-columns:minmax(220px,1fr) 150px 120px 120px 120px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9AA1AD;border-bottom:1px solid #B8AE98;padding-bottom:6px\">\n                  <span>Subpartida<\u002Fspan><span>Fuente<\u002Fspan><span style=\"text-align:right\">Codificado<\u002Fspan><span style=\"text-align:right\">Certificado<\u002Fspan><span style=\"text-align:right\">Devengado<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ f.subs }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:minmax(220px,1fr) 150px 120px 120px 120px;padding:7px 0;border-bottom:1px dotted #DCD6C8;font-size:12.5px;align-items:baseline\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#3B4252;word-break:break-all;padding-right:12px\">{{ s.codigo }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;color:#6B7280\">{{ s.fuente }}<\u002Fspan>\n                    <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums\">{{ s.codificado }}<\u002Fspan>\n                    <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:#0F3460\">{{ s.certificado }}<\u002Fspan>\n                    <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:#3F6B45\">{{ s.devengado }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:grid;grid-template-columns:minmax(240px,1fr) repeat(4,124px) 124px 66px 30px;padding:14px 24px;background:#F4F0E6;border-top:2px solid #1A1F2C;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums\">\n          <span style=\"font-family:'Inter',sans-serif;font-weight:700;letter-spacing:.04em\">TOTAL {{ etiquetaTotal }}<\u002Fspan>\n          <sc-for list=\"{{ totales }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <span style=\"text-align:right;padding:0 6px;color:{{ t.color }}\">{{ t.valor }}<\u002Fspan>\n          <\u002Fsc-for>\n          <span style=\"text-align:right;padding:0 6px;color:#0F3460\">{{ totalPorCertificar }}<\u002Fspan>\n          <span style=\"text-align:right;padding:0 6px;color:#3F6B45\">{{ totalPct }}<\u002Fspan>\n          <span><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ esMensual }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <sc-if value=\"{{ notaGlobalMes }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0 0 14px;padding:10px 14px;background:#F5EBC9;border-left:3px solid #C9A227;font-size:12.5px;color:#5F4E12\">{{ notaGlobalMes }}<\u002Fp>\n        <\u002Fsc-if>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));background:#fff;border:1px solid #DCD6C8\">\n          <sc-for list=\"{{ kpisMes }}\" as=\"k\" hint-placeholder-count=\"4\">\n            <div style=\"padding:20px 24px 18px;border-left:1px solid #E8E2D2\">\n              <div style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:#6B7280;font-weight:600;margin-bottom:12px\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font-family:'DM Serif Display',Georgia,serif;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;color:{{ k.color }}\">{{ k.valor }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#6B7280;margin-top:9px;line-height:1.45\">{{ k.nota }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <section style=\"background:#fff;border:1px solid #DCD6C8;padding:22px 24px 20px;margin-top:22px\">\n          <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0 0 4px\">Cómo avanza la ejecución<\u002Fh2>\n          <p style=\"margin:0 0 18px;font-size:12.5px;color:#6B7280\">Acumulado mes a mes. La distancia entre las líneas es lo que está trabado entre una etapa y la siguiente.<\u002Fp>\n          <svg sc-camel-view-box=\"0 0 720 260\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%;height:270px;display:block\">\n            <sc-for list=\"{{ ejeY }}\" as=\"g\" hint-placeholder-count=\"5\">\n              <g>\n                <line x1=\"58\" x2=\"712\" y1=\"{{ g.y }}\" y2=\"{{ g.y }}\" stroke=\"#E8E2D2\" stroke-width=\"1\"><\u002Fline>\n                <text x=\"52\" y=\"{{ g.ty }}\" text-anchor=\"end\" font-family=\"JetBrains Mono, monospace\" font-size=\"9\" fill=\"#9AA1AD\">{{ g.label }}<\u002Ftext>\n              <\u002Fg>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ lineas }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <polyline points=\"{{ l.points }}\" fill=\"none\" stroke=\"{{ l.color }}\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\u002Fpolyline>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ ejeX }}\" as=\"x\" hint-placeholder-count=\"8\">\n              <text x=\"{{ x.x }}\" y=\"252\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"9.5\" fill=\"#6B7280\">{{ x.label }}<\u002Ftext>\n            <\u002Fsc-for>\n          <\u002Fsvg>\n          <div style=\"display:flex;gap:20px;flex-wrap:wrap;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#6B7280\">\n            <sc-for list=\"{{ lineas }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <span style=\"display:inline-flex;align-items:center;gap:7px\"><i style=\"width:14px;height:3px;background:{{ l.color }}\"><\u002Fi>{{ l.label }} · {{ l.final }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"background:#fff;border:1px solid #DCD6C8;padding:22px 24px 24px;margin-top:22px\">\n          <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0 0 4px\">Movimiento mes a mes<\u002Fh2>\n          <p style=\"margin:0 0 20px;font-size:12.5px;color:#6B7280\">Barra superior: certificación del mes — en rojo cuando se liberó más de lo que se certificó. Barra inferior: devengado. Clic en el mes lo fija como periodo.<\u002Fp>\n          <sc-for list=\"{{ serie }}\" as=\"m\" hint-placeholder-count=\"8\">\n            <div sc-camel-on-click=\"{{ m.on }}\" style=\"display:grid;grid-template-columns:70px 1fr 130px 130px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid #E8E2D2;cursor:pointer;background:{{ m.fondo }}\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:{{ m.peso }}\">{{ m.etiqueta }}<\u002Fspan>\n              <div>\n                <div style=\"height:9px;background:#F4F0E6;margin-bottom:3px\"><i style=\"display:block;height:100%;width:{{ m.aCert }};background:{{ m.colorCert }}\"><\u002Fi><\u002Fdiv>\n                <div style=\"height:9px;background:#F4F0E6\"><i style=\"display:block;height:100%;width:{{ m.aDev }};background:#3F6B45\"><\u002Fi><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;font-variant-numeric:tabular-nums;color:{{ m.colorCert }}\">{{ m.cert }}<\u002Fspan>\n              <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;font-variant-numeric:tabular-nums;color:#3F6B45\">{{ m.dev }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n\n        <sc-if value=\"{{ hayMesSel }}\" hint-placeholder-val=\"{{ false }}\">\n          <section style=\"background:#fff;border:1px solid #DCD6C8;padding:22px 24px 20px;margin-top:22px\">\n            <h2 style=\"font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:21px;font-weight:400;margin:0 0 4px\">Partidas con movimiento en {{ mesSelEtiqueta }}<\u002Fh2>\n            <p style=\"margin:0 0 16px;font-size:12.5px;color:#6B7280\">{{ notaMes }}<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:minmax(200px,1fr) repeat(4,130px);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9AA1AD;border-bottom:1px solid #1A1F2C;padding-bottom:7px\">\n              <span>Partida<\u002Fspan><span style=\"text-align:right\">Certificado<\u002Fspan><span style=\"text-align:right\">Comprometido<\u002Fspan><span style=\"text-align:right\">Devengado<\u002Fspan><span style=\"text-align:right\">Pagado<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ filasMes }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid;grid-template-columns:minmax(200px,1fr) repeat(4,130px);padding:8px 0;border-bottom:1px solid #E8E2D2;align-items:baseline\">\n                <span>\n                  <span style=\"font-size:13px;font-weight:500\">{{ p.denominacion }}<\u002Fspan>\n                  <span style=\"display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#9AA1AD\">{{ p.codigo }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums;color:{{ p.colorCert }}\">{{ p.certificado }}<\u002Fspan>\n                <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums\">{{ p.comprometido }}<\u002Fspan>\n                <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums;color:#3F6B45\">{{ p.devengado }}<\u002Fspan>\n                <span style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums;color:#6B7280\">{{ p.pagado }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <p style=\"margin:30px 0 0;padding-top:14px;border-top:1px solid #DCD6C8;font-size:12.5px;color:#6B7280\">{{ pie }}<\u002Fp>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;decimales&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Formato&quot;}}\">\nclass Component extends DCLogic {\n  state = { d:null, err:null, tab:'resumen', mes:'', grupo:'', ambito:'todo', orden:'monto', estadoP:'', abiertos:{}, abiertosP:{}, ed:{}, raw:{} };\n\n  componentDidMount(){\n    const emb = (window.DATOS_CEDULA && window.DATOS_CEDULA.grupos) ? window.DATOS_CEDULA : null;\n    if(emb) this.setState({d:emb, origen:'instantánea incluida en este archivo'});\n    fetch('datos.json?t='+Date.now(),{cache:'no-store'})\n      .then(r=>r.ok?r.json():Promise.reject(new Error('HTTP '+r.status)))\n      .then(j=>{ if(j&&j.grupos) this.setState({d:j, origen:'datos.json'}); })\n      .catch(e=>{ if(!emb) this.setState({err:String(e.message||e)}); });\n  }\n\n  n0(n){ return (Number(n)||0).toLocaleString('es-EC',{maximumFractionDigits:0}); }\n  n2(n){ return (Number(n)||0).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2}); }\n  num(n){ return this.props.decimales ? this.n2(n) : this.n0(n); }\n  money(n){ const s = n<0 ? '−$ ' : '$ '; return s + this.num(Math.abs(n)); }\n  pct(a,b){ return b>0 ? (a/b*100).toFixed(1)+' %' : '—'; }\n  w(a,b){ return b>0 ? Math.min(100, Math.max(0, a/b*100)).toFixed(1)+'%' : '0%'; }\n\n  parseNum(s){\n    let x=String(s).trim().replace(/[^0-9.,-]/g,'');\n    if(!x) return null;\n    const neg=/^-/.test(x); x=x.replace(/-/g,'');\n    if(x.indexOf(',')>=0) x=x.replace(/\\./g,'').replace(',','.');\n    else if((x.match(/\\./g)||[]).length>1) x=x.replace(/\\./g,'');\n    else { const p=x.split('.'); if(p.length===2 && p[1].length===3) x=p.join(''); }\n    const n=parseFloat(x);\n    return isNaN(n) ? null : (neg?-n:n);\n  }\n  val(g,k){ const e=this.state.ed[g.codigo+'|'+k]; return e===undefined ? (g[k]||0) : e; }\n  editado(cod,k){ return this.state.ed[cod+'|'+k]!==undefined; }\n\n  porAmbito(arr){\n    const a=this.state.ambito;\n    if(a==='todo') return arr;\n    const q = a==='comp';\n    return arr.filter(x=>!!x.computable===q);\n  }\n  gruposFiltrados(){\n    const gs=this.porAmbito((this.state.d&&this.state.d.grupos)||[]);\n    return this.state.grupo ? gs.filter(g=>g.codigo===this.state.grupo) : gs;\n  }\n  todosProyectos(){\n    const d=this.state.d; if(!d) return [];\n    if(this._tp) return this._tp;\n    const comp={}; (d.grupos||[]).forEach(g=>comp[g.codigo]=!!g.computable);\n    const plan=(d.planificados||[]).map(p=>({\n      nombre:p.objeto, beneficiario:'', certificacion:'', fecha:'', preparatoria:true,\n      codificado:p.monto, certificado:0, comprometido:0, devengado:0, pagado:0, avance:0,\n      estado:'planificado', computable:!!comp[p.general], generales:[p.general],\n      fuentes:p.fuente?[p.fuente]:[], naturaleza:p.naturaleza, faseP:p.fase, alerta:p.estado,\n      partidas:[{partida:p.partida, general:p.general, codificado:p.monto, certificado:0, comprometido:0, devengado:0}]\n    }));\n    this._tp=(d.proyectos||[]).filter(p=>p.estado!=='planificado').concat(plan);\n    return this._tp;\n  }\n  proyectosFiltrados(){\n    let ps=this.porAmbito(this.todosProyectos());\n    if(this.state.grupo) ps=ps.filter(p=>(p.generales||[]).indexOf(this.state.grupo)>=0);\n    const e=this.state.estadoP;\n    if(e==='pendiente') ps=ps.filter(p=>p.estado!=='anulada' && p.devengado<=0);\n    else if(e==='sin_comprometer') ps=ps.filter(p=>p.estado!=='anulada' && p.certificado>0 && p.comprometido<=0);\n    else if(e==='sin_devengar') ps=ps.filter(p=>p.estado!=='anulada' && p.comprometido>0 && p.devengado<=0);\n    else if(e==='parcial') ps=ps.filter(p=>p.devengado>0 && p.avance<100);\n    else if(e) ps=ps.filter(p=>p.estado===e);\n    const o=this.state.orden;\n    return ps.slice().sort((a,b)=> o==='avance' ? (b.avance-a.avance) : o==='devengado' ? (b.devengado-a.devengado) : (b.codificado-a.codificado));\n  }\n  totalesDe(gs){\n    const t={codificado:0,certificado:0,comprometido:0,devengado:0,pagado:0,asignacion:0,reformas:0};\n    gs.forEach(g=>Object.keys(t).forEach(k=>t[k]+=this.val(g,k)));\n    t.saldo_certificar=t.codificado-t.certificado;\n    t.saldo_devengar=t.comprometido-t.devengado;\n    return t;\n  }\n  mesActual(){\n    const ms=(this.state.d&&this.state.d.mensual)||[];\n    return this.state.mes ? ms.find(m=>m.mes===this.state.mes)||null : null;\n  }\n  partidasMes(m){\n    if(!m) return [];\n    return this.state.grupo ? m.partidas.filter(p=>p.codigo===this.state.grupo||String(p.codigo).indexOf(this.state.grupo)===0) : m.partidas;\n  }\n\n  setTab(v){ this.setState({tab:v}); }\n  setMes(v){ this.setState({mes:v}); }\n  setGrupo(v){ this.setState({grupo:v}); }\n\n  exportar = () => {\n    const gs=this.gruposFiltrados();\n    const cab=['Codigo','Denominacion','Codificado','Certificado','Comprometido','Devengado','Por certificar','% ejecucion'];\n    const filas=gs.map(g=>{\n      const c=this.val(g,'codificado'), ce=this.val(g,'certificado'), co=this.val(g,'comprometido'), de=this.val(g,'devengado');\n      return [g.codigo,'\"'+g.denominacion+'\"',c.toFixed(2),ce.toFixed(2),co.toFixed(2),de.toFixed(2),(c-ce).toFixed(2),(c>0?(de/c*100).toFixed(1):'0')];\n    });\n    const t=this.totalesDe(gs);\n    filas.push(['TOTAL','\"\"',t.codificado.toFixed(2),t.certificado.toFixed(2),t.comprometido.toFixed(2),t.devengado.toFixed(2),t.saldo_certificar.toFixed(2),(t.codificado>0?(t.devengado/t.codificado*100).toFixed(1):'0')]);\n    const csv='\\ufeff'+[cab.join(';')].concat(filas.map(f=>f.join(';'))).join('\\n');\n    const a=document.createElement('a');\n    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));\n    a.download='cedula-presupuestaria'+(this.state.mes?'-'+this.state.mes:'')+'.csv';\n    a.click(); URL.revokeObjectURL(a.href);\n  };\n\n  renderVals(){\n    const d=this.state.d, S=this.state;\n    const base={\n      cargando:!d && !S.err,\n      esResumen:!!d && S.tab==='resumen',\n      esPartidas:!!d && S.tab==='partidas',\n      esMensual:!!d && S.tab==='mensual',\n      esProyectos:!!d && S.tab==='proyectos',\n      verTodo:()=>this.setState({ambito:'todo',grupo:''}),\n      grupoSel:S.grupo, ambitoSel:S.ambito, ordenSel:S.orden,\n      onGrupo:(e)=>this.setState({grupo:e.target.value}),\n      onAmbito:(e)=>this.setState({ambito:e.target.value}),\n      onOrden:(e)=>this.setState({orden:e.target.value}),\n      onEstadoP:(e)=>this.setState({estadoP:e.target.value}),\n      estadoPSel:S.estadoP,\n      opcionesAmbito:(()=>{\n        const gsT=(d&&d.grupos)||[], nC=gsT.filter(g=>g.computable).length, nN=gsT.length-nC;\n        return [{valor:'todo',label:'Todo el presupuesto ('+gsT.length+')',vacio:false},\n                {valor:'comp',label:'Solo gasto computable ('+nC+')',vacio:nC===0},\n                {valor:'nocomp',label:'Solo no computable ('+nN+')',vacio:nN===0}];\n      })(),\n      opcionesOrden:[{valor:'monto',label:'Monto codificado'},{valor:'devengado',label:'Devengado'},{valor:'avance',label:'Avance'}],\n      imprimir:()=>window.print(),\n      exportar:this.exportar,\n      descartar:()=>this.setState({ed:{},raw:{}}),\n      hayEdiciones:Object.keys(S.ed).length>0,\n      textoEdiciones:Object.keys(S.ed).length+' cifra(s) editada(s) — escenario local',\n      alcance:'', pie:'',\n      subtitulo: d ? ((d.fuentes&&d.fuentes.cedula&&d.fuentes.cedula.direccion)||d.fuente) : 'Cargando fuente…',\n      sello: d ? ('corte '+d.corte+(S.origen?' · '+S.origen:'')) : (S.err?('sin datos: '+S.err):'—')\n    };\n    if(!d) return base;\n\n    const ms=d.mensual||[], gsTodos=d.grupos||[], gs=this.gruposFiltrados();\n    const t=this.totalesDe(gs), mSel=this.mesActual();\n\n    const nProy={}, planMonto={}, planN={}, planPorG={};\n    (d.proyectos||[]).forEach(p=>{ if(p.estado==='anulada') return;\n      (p.generales||[]).forEach(cod=>{ nProy[cod]=(nProy[cod]||0)+1; }); });\n    (d.planificados||[]).forEach(p=>{\n      planMonto[p.general]=(planMonto[p.general]||0)+p.monto;\n      planN[p.general]=(planN[p.general]||0)+1;\n      (planPorG[p.general]=planPorG[p.general]||[]).push(p);\n    });\n\n    base.vacio = gs.length===0;\n    if(base.vacio){\n      base.esResumen=false; base.esPartidas=false; base.esProyectos=false; base.esMensual=false;\n      base.textoVacio = S.ambito==='nocomp'\n        ? 'Esta carga de datos no contiene partidas no computables: las '+gsTodos.length+' partidas de la cédula pertenecen a los grupos computables (73, 75, 77, 84 y 88).'\n        : S.ambito==='comp'\n          ? 'Esta carga de datos no contiene partidas computables.'\n          : 'No hay partidas que cumplan los filtros seleccionados.';\n    }\n\n    base.filtrado = S.ambito!=='todo' || !!S.grupo;\n    base.tabs=[['resumen','Resumen',this.money(this.totalesDe(gsTodos).codificado)],['partidas','Partidas',gs.length+' de '+gsTodos.length],['proyectos','Proyectos',this.proyectosFiltrados().length+' del PAC'],['mensual','Mensual',ms.length+' meses']]\n      .map(([k,label,sub])=>{ const on=S.tab===k; return {label,sub,on:()=>this.setTab(k),\n        fg:on?'#0F3460':'#6B7280', linea:on?'#0F3460':'transparent', chipBg:on?'#0F3460':'#F4F0E6', chipFg:on?'#fff':'#9AA1AD'}; });\n\n    base.meses=[{mes:'',label:'Todo el año'}].concat(ms.map(m=>({mes:m.mes,label:m.corto})))\n      .map(o=>{ const on=S.mes===o.mes; return {label:o.label,on:()=>this.setMes(o.mes),\n        bg:on?'#0F3460':'#fff', fg:on?'#fff':'#3B4252', borde:on?'#0F3460':'#DCD6C8'}; });\n\n    const corta=(s,n)=>s.length>(n||32)?s.slice(0,(n||32)-1).replace(/[ ,]+$/,'')+'…':s;\n    base.opcionesGrupo=[{valor:'',label:'Todas las partidas'}].concat(\n      this.porAmbito(gsTodos).map(g=>({valor:g.codigo, label:g.codigo+' · '+corta(g.denominacion,46)})));\n\n    const etAmb={todo:'todo el presupuesto',comp:'solo computable',nocomp:'solo no computable'};\n    base.alcance=(this.state.grupo?'1 partida':gs.length+' partidas')+' · '+etAmb[S.ambito]+' · '+(mSel?mSel.etiqueta:'acumulado del ejercicio');\n\n    const fuenteKPI = mSel ? {codificado:t.codificado,certificado:mSel.certificado,comprometido:mSel.comprometido,devengado:mSel.devengado} : t;\n    const notaMesKPI = mSel ? ('movimiento de '+mSel.etiqueta) : null;\n    base.kpis=[\n      {label:'Codificado vigente', valor:this.money(t.codificado), color:'#1A1F2C', ancho:'100%',\n       nota:'asignación '+this.money(t.asignacion)+' · reformas '+this.money(t.reformas)},\n      {label:'Certificado', valor:this.money(fuenteKPI.certificado), color:'#0F3460', ancho:this.w(fuenteKPI.certificado,t.codificado),\n       nota:notaMesKPI||this.pct(t.certificado,t.codificado)+' del codificado · por certificar '+this.money(t.saldo_certificar)},\n      {label:'Comprometido', valor:this.money(fuenteKPI.comprometido), color:'#C9A227', ancho:this.w(fuenteKPI.comprometido,t.codificado),\n       nota:notaMesKPI||this.pct(t.comprometido,t.codificado)+' del codificado'},\n      {label:'Devengado', valor:this.money(fuenteKPI.devengado), color:'#3F6B45', ancho:this.w(fuenteKPI.devengado,t.codificado),\n       nota:notaM ', nota:mSel.movimientos+' movimientos · '+mSel.anulaciones+' anulaciones'},\n        {label:'Devengado acumulado', valor:this.money(mSel.acum_devengado), color:'#1A1F2C', nota:'al cierre de '+mSel.etiqueta}\n      ] : [\n        {label:'Meses con movimiento', valor:String(ms.length), color:'#1A1F2C', nota:u.movimientos+' movimientos en '+u.etiqueta},\n        {label:'Certificado acumulado', valor:this.money(u.acum_certificado), color:'#0F3460', nota:'al cierre de '+u.etiqueta},\n        {label:'Comprometido acumulado', valor:this.money(u.acum_comprometido), color:'#C9A227', nota:this.pct(u.acum_comprometido,u.acum_certificado)+' de lo certificado'},\n        {label:'Devengado acumulado', valor:this.money(u.acum_devengado), color:'#3F6B45', nota:this.pct(u.acum_devengado,u.acum_comprometido)+' de lo comprometido'}\n      ];\n    } else { base.ejeY=[]; base.ejeX=[]; base.lineas=[]; base.kpisMes=[]; }\n\n    const sum=(arr,k)=>arr.reduce((a,x)=>a+(x[k]||0),0);\n    const rpTot=sum(ps,'codificado')||1;\n    base.kpisProy=[\n      {label:'Proyectos listados', valor:String(ps.length), color:'#1A1F2C', ancho:'100%',\n       nota:this.money(sum(ps,'codificado'))+' codificados · '+((base.filtrado||S.estadoP)?'con los filtros activos':'de '+this.todosProyectos().length+' registros del PAC')},\n      {label:'Certificado', valor:this.money(sum(ps,'certificado')), color:'#0F3460', ancho:this.w(sum(ps,'certificado'),rpTot), nota:this.pct(sum(ps,'certificado'),rpTot)+' del codificado'},\n      {label:'Comprometido', valor:this.money(sum(ps,'comprometido')), color:'#C9A227', ancho:this.w(sum(ps,'comprometido'),rpTot), nota:this.pct(sum(ps,'comprometido'),rpTot)+' del codificado'},\n      {label:'Devengado', valor:this.money(sum(ps,'devengado')), color:'#3F6B45', ancho:this.w(sum(ps,'devengado'),rpTot), nota:this.pct(sum(ps,'devengado'),rpTot)+' del codificado'}\n    ];\n\n    base.pie=gsTodos.length+' partidas generales · '+gsTodos.reduce((a,g)=>a+g.partidas.length,0)+' subpartidas. Importes de la cédula presupuestaria de eGob, corte '+d.corte+'. Las ediciones son locales y no modifican el sistema de origen.';\n    return base;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
